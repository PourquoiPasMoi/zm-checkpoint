// ZM Checkpoint prototype controls.
// Run once from the Plutonium console: exec zm_checkpoint.cfg

bind F5 "set zmcp_command save"
bind F6 "set zmcp_command status"
bind 0 "zmcp_counter_toggle"
bind KP_INS "zmcp_counter_toggle"
bind F8 "set zmcp_command clear"
// Use from a supported private lobby. xpartygo performs the Zombies session
// bootstrap; a raw `map` command leaves the round controller uninitialized.
bind F9 "set zmcp_autoload 1; xpartygo"

set zmcp_command ""
set zmcp_autoload 0

